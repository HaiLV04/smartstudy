<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dò Mìn Tri Thức — StudyAI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
<link rel="stylesheet" href="../../assets/css/style.css">
<style>
  .path-track { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
  .path-tile {
    width: 34px; height: 34px; border-radius: 8px; background: var(--ink-100);
    display: flex; align-items: center; justify-content: center; font-size: 1rem;
    border: 2px solid var(--ink-300); flex-shrink: 0;
  }
  .path-tile.done { background: #dcfce7; border-color: var(--success); }
  .path-tile.current { background: #dbeafe; border-color: var(--brand-2); animation: pulse 1s infinite; }
  .path-tile.boom { background: #fee2e2; border-color: var(--danger); }
  @keyframes pulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.12);} }
  .mine-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; max-width: 720px; margin: 24px auto 0; }
  @media (max-width:560px){ .mine-grid { grid-template-columns: 1fr; } }
  .mine-cell {
    background: #e2e8f0; border: 2px solid var(--ink-300); border-radius: var(--radius-md);
    padding: 20px 16px; text-align: center; font-weight: 800; font-size: 1.02rem;
    color: var(--ink-700); position: relative; min-height: 76px;
    display:flex; align-items:center; justify-content:center;
  }
  .mine-cell:hover:not(.revealed) { border-color: var(--brand-2); background: #eef4ff; transform: translateY(-2px); }
  .mine-cell .qmark { font-size: 1.3rem; color: var(--ink-500); }
  .mine-cell.revealed.safe { background: #dcfce7; border-color: var(--success); color: #166534; }
  .mine-cell.revealed.mine { background: #fee2e2; border-color: var(--danger); color: #991b1b; animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
  .lives-hearts { font-size: 1.1rem; letter-spacing: 3px; }
</style>
</head>
<body>

<div class="game-shell">
  <div class="game-topbar">
    <div class="container">
      <a href="../../index.html" class="back-link">← Trang chủ</a>
      <span class="game-title">💣 Dò Mìn Tri Thức</span>
      <div class="topbar-tools">
        <button class="btn btn-ghost" id="openSettingsBtn">⚙️ Soạn câu hỏi</button>
        <button class="btn btn-outline" id="restartBtn">🔄 Chơi lại</button>
      </div>
    </div>
  </div>

  <div class="game-stage">
    <div class="container">
      <div class="side-note">💡 Chọn ô chứa đáp án đúng để vượt qua bãi mìn. Chọn nhầm ô có mìn sẽ mất 1 mạng — hết 3 mạng là thua cuộc!</div>

      <div class="scoreboard">
        <div class="score-chip">❤️ Mạng: <span class="lives-hearts" id="livesDisplay">❤️❤️❤️</span></div>
        <div class="score-chip"><span class="dot" style="background:var(--brand-2);"></span> Câu hỏi: <span id="qProgress">0/0</span></div>
      </div>

      <div class="game-panel">
        <div class="path-track" id="pathTrack"></div>
        <div id="questionArea"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>⚙️ Soạn câu hỏi</h3>
      <button class="modal-close" onclick="SA.closeModal('settingsModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label class="field-label">Bộ câu hỏi trắc nghiệm</label>
        <textarea id="quizInput" rows="9"></textarea>
        <p class="field-hint">Mỗi dòng 1 câu, theo mẫu: <b>Câu hỏi | Đáp án đúng | Đáp án sai 1 | Đáp án sai 2 | Đáp án sai 3</b></p>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="SA.closeModal('settingsModal')">Huỷ</button>
      <button class="btn btn-primary" id="saveSettingsBtn">💾 Lưu lại</button>
    </div>
  </div>
</div>

<script src="../../assets/js/common.js"></script>
<script src="app.js"></script>
</body>
</html>
